[package]
name = "arka-desktop"
version = "0.1.0"
description = "Arka — local AI agent desktop shell"
authors = ["Arka"]
edition = "2021"

[lib]
name = "arka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
